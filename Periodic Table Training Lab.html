/* ---------- ui helpers ---------- */
const O={tbl:{mode:'cat',flt:'all'},fc:{mode:'f1',pool:'core'},qs:{pool:'core',n:'10'},sp:{lv:'0'}};
let view='home',fcs=null,qz=null,spr=null,rstArm=0;
const sel=(p,opts,v)=>`<select data-s="${p}" aria-label="${p}">${opts.map(o=>`<option value="${o[0]}"${o[0]==v?' selected':''}>${o[1]}</option>`).join('')}</select>`;
const FL={all:()=>1,core:e=>e.z<=36,imp:e=>IMP.includes(e.z),metals:e=>['alk','ae','tm','pt','lan','act'].includes(e.k),nonm:e=>['nm','hal','ng'].includes(e.k)};
const colr=(e,m)=>m=='cat'?CC[e.k]:m=='blk'?BC[e.b]:m=='st'?SC[e.st]:MC(sc(e.z));
const tile=(e,o={})=>{const v=o.v||0;return `<button class="tl${o.dim?' dim':''}" data-z="${e.z}" title="${v?'':nm(e)}" aria-label="${v==2?'row '+e.r+' column '+e.c:e.z+' '+nm(e)}" style="grid-row:${e.r};grid-column:${e.c};--c:${o.col}"><b>${v?'':e.z}</b><strong>${v==2?'':e.s}</strong><small>${v?'':nm(e)}</small>${v?'':`<i style="width:${sc(e.z)}%"></i>`}</button>`};
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const stages=[[1,10],[11,18],[19,20],[21,30],[31,36]],avg=(a,b)=>{let s=0;for(let z=a;z<=b;z++)s+=sc(z);return Math.round(s/(b-a+1))};
/* ---------- views ---------- */
const V={};
V.home=()=>{const a=st.qa?Math.round(100*st.qc/st.qa):0,low=stages.map(s=>[avg(...s),s]).sort((x,y)=>x[0]-y[0])[0],fv=st.fav.map(z=>E[z-1]);
return `<section class="hero"><h1>${t('h1')}<br><span>${t('h2')}</span></h1><p>${t('sub')}</p><div class="row"><button class="btn pri" data-a="go" data-v="quiz">${t('quiz')}</button><button class="btn" data-a="go" data-v="flash">${t('flash')}</button><button class="btn" data-a="go" data-v="speed">${t('speed')}</button><button class="btn" data-a="go" data-v="table">${t('table')}</button></div></section>
<div class="g g5"><div class="card stat"><b>${st.qa}</b><span>${t('ans')}</span></div><div class="card stat"><b>${a}%</b><span>${t('acc')}</span></div><div class="card stat"><b>${streak()}</b><span>${t('streak')}</span></div><div class="card stat"><b>${E.filter(e=>sc(e.z)>=81).length}</b><span>${t('mast')}</span></div><div class="card stat"><b>${E.filter(e=>wk(e.z)).length}</b><span>${t('weak')}</span></div></div>
<div class="g g2" style="margin-top:10px"><div class="card"><h3>${t('track')}</h3>${stages.map(s=>`<div class="row" style="margin:8px 0"><span class="sci mut" style="width:56px">${s[0]}–${s[1]}</span><div style="flex:1">${bar(avg(...s))}</div><span class="mut" style="width:38px">${avg(...s)}%</span></div>`).join('')}
<p class="mut">${t('rec')}: <b class="sci">${low[1][0]}–${low[1][1]}</b> · ${low[0]}%</p><button class="btn" data-a="go" data-v="flash">${t('flash')}</button></div>
<div class="card"><h3>${t('fvs')}</h3><div class="row">${fv.length?fv.map(e=>`<button class="btn" data-z="${e.z}">${e.s}</button>`).join(''):`<span class="mut">${t('none')}</span>`}</div>
<h3>${t('priv')}</h3><div class="row"><button class="btn" data-a="exp">${t('exp')}</button><button class="btn" data-a="imp">${t('imp2')}</button><button class="btn" data-a="rst">${rstArm?t('rstq'):t('rst')}</button></div><textarea id="io" rows="3" style="width:100%;margin-top:8px" aria-label="JSON"></textarea><div class="mut" id="msg"></div></div></div>`};
V.table=()=>{const m=O.tbl.mode,f=FL[O.tbl.flt]||(e=>e.k==O.tbl.flt);
const leg=m=='cat'?CK.map(k=>[CC[k],t(k)]):m=='blk'?Object.keys(BC).map(k=>[BC[k],k+'-block']):m=='st'?Object.keys(SC).map(k=>[SC[k],t(k)]):[['#6b7686','0%'],['#ff667a','1–20'],['#ff9a5c','21–40'],['#ffc857','41–60'],['#b6e36b','61–80'],['#65e6a5','81–100%']];
return `<div class="row">${sel('tbl.mode',[['cat',t('m_cat')],['blk',t('m_blk')],['st',t('m_st')],['ms',t('m_ms')]],m)}${sel('tbl.flt',[['all',t('all')],['core',t('core')],['imp',t('imp')],['metals',t('metals')],['nonm',t('nonm')],...CK.map(k=>[k,t(k)])],O.tbl.flt)}</div>
<div class="leg" style="margin:10px 0">${leg.map(l=>`<span><i style="background:${l[0]}"></i>${l[1]}</span>`).join('')}</div><div class="ov"><div class="pt">${E.map(e=>tile(e,{col:colr(e,m),dim:!f(e)})).join('')}</div></div>`};
const FM={f1:[e=>e.z,e=>e.s],f2:[e=>e.s,e=>nm(e)],f3:[e=>nm(e),e=>e.s],f4:[e=>e.s,e=>e.z],f5:[e=>e.s+' · '+nm(e),e=>catL(e)],f6:[e=>e.s+' · '+nm(e),e=>`<span class="sci">${e.cf}</span>`]};
const fcNext=()=>{fcs={e:pick(poolOf(O.fc.pool),fcs&&fcs.e.z),flip:0}};
V.flash=()=>{if(!fcs)fcNext();const e=fcs.e,[fr,bk]=FM[O.fc.mode],m=st.m[e.z],b=m?Math.max(m.b||0,1)==1&&!(m.b>=1)?1:m.b:null,lab=m?t('s'+Math.max(1,m.b||0)):t('s0');
return `<div class="row">${sel('fc.mode',Object.keys(FM).map(k=>[k,t(k)]),O.fc.mode)}${sel('fc.pool',[['core',t('core')],['imp',t('imp')],['all',t('all')],['weak',t('weakel')]],O.fc.pool)}</div>
<div class="card fc" data-a="flip" tabindex="0" role="button" style="margin:12px 0">${fcs.flip?`<div class="big">${bk(e)}</div><p>${e.s} · ${nm(e)} · <span class="sci">${e.z}</span> · ${catL(e)}</p>`:`<div class="big">${fr(e)}</div><p class="mut">${t('tap')}</p>`}<span class="mut">${lab}</span></div>
${fcs.flip?`<div class="row">${['again','hard','good','easy'].map((k,i)=>`<button class="btn${i==2?' pri':''}" data-a="rate" data-v="${i}">${t(k)} <small>${i+1}</small></button>`).join('')}</div>`:''}`};
function rate(g){const e=fcs.e,m=st.m[e.z]=st.m[e.z]||{c:0,w:0,b:0};if(g==0)m.w++;else m.c+=[0,.5,1,2][g];m.b=[0,Math.max(1,m.b),Math.min(3,m.b+1),Math.min(3,m.b+2)][g];st.qa++;if(g)st.qc++;mark();save();fcNext();render()}
function mkQ(pool){const e=pick(pool,qz.last);qz.last=e.z;let ty=1+Math.floor(Math.random()*7);if(ty==5&&!e.g)ty=1;
 const near=pool.filter(x=>x.z!=e.z&&Math.abs(x.z-e.z)<=8),els=shuf([e,...shuf(near.length>2?near:E.filter(x=>x.z!=e.z&&Math.abs(x.z-e.z)<=8)).slice(0,3)]);let x,o;
 if(ty==1){x=nm(e);o=els.map(y=>({l:y.s,ok:y==e}))}else if(ty==2){x=e.z;o=els.map(y=>({l:nm(y),ok:y==e}))}else if(ty==3){x=e.s;o=els.map(y=>({l:nm(y),ok:y==e}))}
 else if(ty==4){x=nm(e);o=shuf(shuf(CK.filter(k=>k!=e.k)).slice(0,3).concat(e.k)).map(k=>({l:t(k),ok:k==e.k}))}
 else if(ty==5||ty==6){const key=ty==5?'g':'p',mx=ty==5?18:7;x=nm(e);o=shuf(shuf([...Array(mx).keys()].map(i=>i+1).filter(v=>v!=e[key])).slice(0,3).concat(e[key])).map(v=>({l:v,ok:v==e[key]}))}
 else{x=`<span class="sci">${e.cf}</span>`;o=els.map(y=>({l:y.s,ok:y==e}))}
 return{q:t('q'+ty).replace('{x}',x),o,e}}
V.quiz=()=>{if(!qz)return `<div class="card"><h3>${t('quiz')}</h3><div class="row">${sel('qs.pool',[['core',t('core')],['imp',t('imp')],['all',t('all')],['weak',t('weakel')]],O.qs.pool)}${sel('qs.n',[['10','10'],['20','20'],['30','30']],O.qs.n)}<button class="btn pri" data-a="qstart">${t('start')}</button></div></div>`;
 if(qz.i>=qz.n)return `<div class="card"><h2>${t('fin')}</h2><div class="big2">${Math.round(100*qz.s/qz.n)}%</div><p>${qz.s} / ${qz.n}</p><button class="btn pri" data-a="qstart">${t('restart')}</button></div>`;
 const c=qz.cur,a=qz.a;return `<div class="card"><div class="mut">${qz.i+1} / ${qz.n} · ${t('score')} ${qz.s}</div>${bar(100*qz.i/qz.n)}<div class="q">${c.q}</div><div class="opts">${c.o.map((o,i)=>`<button class="btn${a!=null?(o.ok?' ok':i==a?' no':''):''}" data-a="ans" data-v="${i}"${a!=null?' disabled':''}>${o.l}</button>`).join('')}</div>
${a!=null?`<div class="${c.o[a].ok?'good':'badc'}"><b>${t(c.o[a].ok?'ok':'no')}</b> — <span class="sci">${c.e.s}</span> · ${nm(c.e)} · ${c.e.z}</div><button class="btn pri" id="nx" data-a="qnext" style="margin-top:10px">${t('next')}</button>`:''}</div>`};
function spStart(){const lv=+O.sp.lv;spr={on:1,pool:poolOf(lv?'all':'core'),sc:0,miss:0,rt:[],end:Date.now()+60000};nextT();spr.iv=setInterval(()=>{const l=Math.max(0,Math.ceil((spr.end-Date.now())/1000)),el=$('#tm');if(el)el.textContent=l;if(!l)spEnd()},200);render()}
const nextT=()=>{spr.tg=pick(spr.pool,spr.tg&&spr.tg.z);spr.t0=Date.now()};
function spHit(z,el){if(!spr||!spr.on)return;const ok=z==spr.tg.z;rec(spr.tg.z,ok);if(ok){spr.sc++;spr.rt.push(Date.now()-spr.t0);nextT()}else{spr.miss++;el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),300)}$('#tg').textContent=nm(spr.tg);$('#ss').textContent=spr.sc}
function spEnd(){clearInterval(spr.iv);spr.on=0;spr.done=1;st.best=Math.max(st.best,spr.sc);save();render()}
V.speed=()=>{if(!spr||spr.done){const r=spr;return `<div class="card"><h3>${t('speed')} · 60s</h3>${r?`<div class="big2">${r.sc}</div><p>${t('acc')}: ${r.sc+r.miss?Math.round(100*r.sc/(r.sc+r.miss)):0}% · ${t('rtm')}: ${r.rt.length?(r.rt.reduce((a,b)=>a+b,0)/r.rt.length/1000).toFixed(1):'–'}s · ${t('miss')}: ${r.miss}</p>`:''}<p class="mut">${t('best')}: ${st.best}</p><div class="row">${sel('sp.lv',[['0',t('l0')],['1',t('l1')],['2',t('l2')]],O.sp.lv)}<button class="btn pri" data-a="spstart">${t('start')}</button></div></div>`}
 const lv=+O.sp.lv;return `<div class="card row" style="justify-content:space-between;position:sticky;top:96px;z-index:3"><span>${t('find')}: <b style="font-size:24px" id="tg">${nm(spr.tg)}</b></span><span>${t('score')} <b id="ss">${spr.sc}</b> · ${t('time')} <b id="tm">60</b></span></div><div class="ov"><div class="pt">${E.map(e=>tile(e,{col:colr(e,'cat'),v:lv==2?2:1})).join('')}</div></div>`};
/* ---------- detail ---------- */
function openEl(z){const e=E[z-1],f=st.fav.includes(z);
$('#dlg').innerHTML=`<div class="row" style="justify-content:space-between"><span class="mut sci">${e.z}</span><button class="btn" data-a="fav" data-v="${z}" aria-pressed="${f}">${f?'★':'☆'} ${t('fav')}</button><button class="btn" data-a="close" aria-label="Close">✕</button></div><div class="big2" style="color:${CC[e.k]}">${e.s}</div><h2 style="margin:4px 0">${e.en}</h2><div style="font-size:20px">${e.fa}</div>
<dl><dt>${t('mass')}</dt><dd class="sci">${e.m}</dd><dt>${t('grp')}</dt><dd>${e.g||'—'}</dd><dt>${t('per')}</dt><dd>${e.p}</dd><dt>${t('blk')}</dt><dd>${e.b}</dd><dt>${t('cat')}</dt><dd>${catL(e)}</dd><dt>${t('sta')}</dt><dd>${t(e.st)}</dd><dt>${t('cfg')}</dt><dd class="sci">${e.cf}</dd><dt>${t('val')}</dt><dd>${e.v==null?t('var'):e.v}</dd><dt>${t('m_ms')}</dt><dd>${sc(z)}%</dd></dl>`;
const d=$('#dlg');d.open||d.showModal()}
/* ---------- render / events ---------- */
function render(){const h=document.documentElement;h.lang=st.lang;h.dir=st.lang=='fa'?'rtl':'ltr';h.dataset.theme=st.theme;
 $('#nav').innerHTML=['home','table','flash','quiz','speed'].map(k=>`<button class="btn${view==k?' on':''}" data-a="go" data-v="${k}">${t(k)}</button>`).join('');
 $('#q').placeholder=t('ph');$('[data-a=lang]').textContent=st.lang=='fa'?'EN':'FA';$('#xp').textContent='★ '+E.filter(e=>sc(e.z)>=81).length+'/118';
 $('#main').innerHTML=V[view]();const n=$('#nx');if(n)n.focus()}
function go(v){if(spr&&spr.on){clearInterval(spr.iv);spr.on=0;spr.done=1}view=v;if(v=='speed'&&spr&&spr.done)spr=null;render()}
function search(q){q=q.trim().toLowerCase();const r=$('#res');if(!q){r.hidden=true;return}
 const m=E.filter(e=>String(e.z)==q||e.s.toLowerCase()==q||e.s.toLowerCase().startsWith(q)||e.en.toLowerCase().includes(q)||e.fa.includes(q)||T.en[e.k].toLowerCase().includes(q)||T.fa[e.k].includes(q)||'g'+e.g==q.replace(/\s/g,'')||'p'+e.p==q.replace(/\s/g,'')).slice(0,8);
 r.innerHTML=m.map(e=>`<li><button data-z="${e.z}" data-q="1"><b class="sci">${e.z} ${e.s}</b> ${nm(e)} <span class="mut">· ${catL(e)}</span></button></li>`).join('')||`<li class="mut" style="padding:8px">${t('none')}</li>`;r.hidden=false}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a],[data-z]');if(!ev.target.closest('.sw'))$('#res').hidden=true;
 if(ev.target==$('#dlg'))$('#dlg').close();if(!el)return;const a=el.dataset.a,v=el.dataset.v;
 if(el.dataset.z&&!a){if(view=='speed'&&el.classList.contains('tl'))return spHit(+el.dataset.z,el);if(el.dataset.q){$('#res').hidden=true;$('#q').value=''}return openEl(+el.dataset.z)}
 if(a=='go')go(v);else if(a=='lang'){st.lang=st.lang=='fa'?'en':'fa';save();render()}else if(a=='theme'){st.theme=st.theme=='dark'?'light':'dark';save();render()}
 else if(a=='flip'){fcs.flip=1-fcs.flip;render()}else if(a=='rate')rate(+v);
 else if(a=='qstart'){qz={i:0,n:+O.qs.n,s:0,a:null,last:0,pool:poolOf(O.qs.pool)};qz.cur=mkQ(qz.pool);render()}
 else if(a=='ans'){if(qz.a!=null)return;qz.a=+v;const ok=qz.cur.o[qz.a].ok;if(ok)qz.s++;rec(qz.cur.e.z,ok);render()}
 else if(a=='qnext'){qz.i++;qz.a=null;if(qz.i<qz.n)qz.cur=mkQ(qz.pool);render()}
 else if(a=='spstart')spStart();else if(a=='close')$('#dlg').close();
 else if(a=='fav'){const z=+v;st.fav=st.fav.includes(z)?st.fav.filter(x=>x!=z):st.fav.concat(z);save();openEl(z);render()}
 else if(a=='exp'){const io=$('#io');io.value=JSON.stringify(st);io.select()}
 else if(a=='imp'){try{const j=JSON.parse($('#io').value);if(typeof j!='object'||!j)throw 0;Object.assign(st,j);save();render();$('#msg').textContent=t('ok2')}catch(e){$('#msg').textContent=t('bad2')}}
 else if(a=='rst'){if(!rstArm){rstArm=1;render();return}try{localStorage.removeItem('ptl')}catch(e){}st.m={};st.fav=[];st.qa=st.qc=st.best=0;st.days=[];rstArm=0;save();render()}});
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-s]');if(!el)return;const[o,k]=el.dataset.s.split('.');O[o][k]=el.value;if(o=='fc')fcs=null;render()});
$('#q').addEventListener('input',ev=>search(ev.target.value));
document.addEventListener('keydown',ev=>{const tg=ev.target.tagName;if((ev.ctrlKey||ev.metaKey)&&ev.key=='k'){ev.preventDefault();return $('#q').focus()}
 if(ev.key=='Escape')$('#res').hidden=true;if(/INPUT|TEXTAREA|SELECT/.test(tg)||ev.ctrlKey||ev.metaKey||ev.altKey)return;const k=ev.key.toLowerCase();
 if(k=='/'){ev.preventDefault();$('#q').focus()}else if(k=='f')go('flash');else if(k=='q')go('quiz');else if(k=='t')go('table');else if(k=='d'){st.theme=st.theme=='dark'?'light':'dark';save();render()}else if(k=='l'){st.lang=st.lang=='fa'?'en':'fa';save();render()}
 else if(view=='flash'&&fcs){if(k==' '&&tg!='BUTTON'){ev.preventDefault();fcs.flip=1-fcs.flip;render()}else if(fcs.flip&&'1234'.includes(k)&&k)rate(+k-1)}});
render();
</script></body></html>
